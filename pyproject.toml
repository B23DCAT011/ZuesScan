[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zues-scan"
dynamic = ["version"]  # from zues_scan.__version__: one place to bump, checked against the tag
description = "Recon orchestrator & vulnerability management (academic project)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "B23DCAT011" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
# The background service (phase 3): queue, worker, web API. The scanning core needs
# none of it: `pip install zues` stays dependency-free.
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "redis>=5.0",
    "rq>=1.16",
    # IANA time zones for cron schedules (cron = "0 2 * * sat Europe/Berlin"): Linux and
    # macOS have them; Windows needs the data as a package.
    "tzdata; sys_platform == 'win32'",
]
# `zues mcp`: ZuesScan as tools for AI agents (Model Context Protocol), as a client
# of a running ZuesScan service. Needed only on the machine that runs the agent.
mcp = [
    "mcp>=2.3,<3",
]
# What the server's tests need on top: an in-memory Redis and FastAPI's test client.
server-test = [
    "httpx>=0.27",
    "fakeredis>=2.20",
    # fakeredis 2.40 breaks on redis-py 8.2.0 (released 2026-11-23): "'method_descriptor'
    # object has no attribute '__closure__'". The service itself works with 8.2.0 (checked
    # against a real Redis), so only the test environment is held back. Lift this once
    # fakeredis supports it.
    "redis<8.2",
]

[project.scripts]
zues = "zues_scan.cli:main"

[tool.setuptools.dynamic]
version = { attr = "zues_scan.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["zues_scan*"]

[tool.setuptools.package-data]
zues_scan = ["data/*.json", "data/*.lock", "data/*.txt", "report/assets/*", "report/vendor/*", "server/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
