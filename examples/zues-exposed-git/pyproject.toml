# A ZuesScan plugin as its own package: installing it is all it takes for ZuesScan to
# offer it (`zues plugins`, `zues scan ... --check exposed-git`).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zues-exposed-git"
version = "0.1.0"
description = "ZuesScan check plugin: .git directories served over HTTP"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []  # ZuesScan itself, installed alongside

[project.entry-points."zues_scan.plugins"]
exposed-git = "zues_exposed_git:PLUGIN"

[tool.setuptools]
packages = ["zues_exposed_git"]
