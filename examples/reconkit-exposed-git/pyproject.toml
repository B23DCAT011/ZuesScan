# A ReconKit plugin as its own package: installing it is all it takes for ReconKit to
# offer it (`reconkit plugins`, `reconkit scan ... --check exposed-git`).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reconkit-exposed-git"
version = "0.1.0"
description = "ReconKit check plugin: .git directories served over HTTP"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []  # ReconKit itself, installed alongside

[project.entry-points."reconkit.plugins"]
exposed-git = "reconkit_exposed_git:PLUGIN"

[tool.setuptools]
packages = ["reconkit_exposed_git"]
