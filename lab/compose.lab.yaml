# ZuesScan lab: deliberately vulnerable services on two ISOLATED networks, scanned by the
# worker of compose.yaml. Start it with lab/up.sh (or see the commands in README "Lab").
#
#   lab-dmz       10.66.1.0/24   worker, Apache 2.4.49 (.20), OpenSSH 7.5 (.22), a Log4Shell
#                                app (.25), the lab's own interactsh server (.53), router (.254)
#   lab-internal  10.66.2.0/24   nginx 1.20.0 (.30), router (.254)
#
# Both networks are isolated: the host side of their bridge has no address (the host is
# unreachable from them, and so is their default gateway) and nothing is NATed out, so
# the vulnerable containers cannot reach the Internet or the host; no port is published.
# Only the worker and the router join them. Never attach a target to another network.
#
# Why not `internal: true`? Docker then drops every packet whose destination is outside
# the network's own subnet, so no router could forward between the two networks - and
# the host stays reachable through the bridge's address. Checked on Engine 28.
services:
  worker:
    environment:
      ZUES_CONFIG: /config/service.toml   # the lab's own file
      # nuclei's out-of-band templates call back to the lab's own interactsh server
      # (G24, D18): never a public one.
      ZUES_INTERACTSH_SERVER: http://oast.zues.lab
    networks:
      default: { gw_priority: 1 }  # its default route stays the normal network's
      lab-dmz: {}
    volumes:
      - ./lab:/config:ro          # lab/service.toml and lab/lab-scope.txt
  web:
    environment:
      ZUES_CONFIG: /config/service.toml   # the lab's own file
    volumes:
      - ./lab:/config:ro
  scheduler:
    environment:
      ZUES_CONFIG: /config/service.toml   # the lab's own file
    volumes:
      - ./lab:/config:ro
    depends_on:
      # No scan before the worker can reach the internal network.
      worker-route:
        condition: service_completed_successfully

  # The worker keeps only NET_RAW: this sidecar shares its network namespace just long
  # enough to add the route to the internal network through the router, then exits.
  worker-route:
    build: lab/router
    image: zues-lab-router:local
    network_mode: "service:worker"
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    entrypoint: ["ip", "route", "replace", "10.66.2.0/24", "via", "10.66.1.254"]
    restart: "no"
    depends_on: [worker, router]

  router:
    build: lab/router
    image: zues-lab-router:local
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW]
    init: true                    # stops at once on `docker compose down`
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      lab-dmz: { ipv4_address: 10.66.1.254 }
      lab-internal: { ipv4_address: 10.66.2.254 }
    restart: unless-stopped

  apache:
    # Apache httpd 2.4.49: CVE-2021-41773 (path traversal, on CISA's KEV list),
    # configured to be exploitable (lab/apache/Dockerfile): nuclei confirms it.
    build: lab/apache
    image: zues-lab-apache:local
    networks:
      lab-dmz: { ipv4_address: 10.66.1.20 }
    restart: unless-stopped

  ssh:
    build: lab/ssh
    image: zues-lab-ssh:local
    networks:
      lab-dmz: { ipv4_address: 10.66.1.22 }
    restart: unless-stopped

  log4shell:
    # A Spring Boot app with log4j 2.14.1: CVE-2021-44228 (Log4Shell, on CISA's KEV list).
    # Its flaw shows in no response: the app looks up a name that the payload carries, so
    # nuclei confirms it only through the out-of-band server below. nmap calls its port
    # "nagios-nsca" (a 404 in JSON); httpx finds it is a web service, nuclei tests it as one.
    image: ghcr.io/christophetd/log4shell-vulnerable-app@sha256:6f88430688108e512f7405ac3c73d47f5c370780b94182854ea2cddc6bd59929
    dns: [10.66.1.53]  # its lookups reach the lab's interactsh server, nothing else
    networks:
      lab-dmz: { ipv4_address: 10.66.1.25 }
    restart: unless-stopped

  oast:
    # The lab's own interactsh server, the DNS authority for oast.zues.lab: a payload's name
    # (<id>.oast.zues.lab) looked up by a target lands here, and nuclei asks it what came.
    # Part of the scanner, not a target: the scope excludes its address. No token (an
    # isolated lab); a real one takes -t and ZUES_INTERACTSH_TOKEN.
    image: projectdiscovery/interactsh-server@sha256:246d8988fed0cfefb28f904c4e1ec4a6bb4b6931288d10794a31577687f02471
    command: ["-d", "oast.zues.lab", "-ip", "10.66.1.53", "-sa", "-duc"]
    networks:
      lab-dmz:
        ipv4_address: 10.66.1.53
        aliases: [oast.zues.lab]  # how the worker (nuclei's client) reaches it
    restart: unless-stopped

  nginx:
    # nginx 1.20.0: CVE-2021-23017 (resolver off-by-one). "Fix" it for the demo with
    # LAB_NGINX=1.27.5 (see README "Lab"), and the next scan marks the finding fixed.
    image: nginx:${LAB_NGINX:-1.20.0}
    networks:
      lab-internal: { ipv4_address: 10.66.2.30 }
    restart: unless-stopped

x-isolated: &isolated
  com.docker.network.bridge.inhibit_ipv4: "true"           # no host address on the bridge
  com.docker.network.bridge.enable_ip_masquerade: "false"  # no NAT to the outside

networks:
  lab-dmz:
    driver_opts: *isolated
    ipam:
      # Containers without a fixed address (the workers) get one in .1-.14: the scope
      # excludes that range, so a scan never reports the scanners themselves.
      config: [{ subnet: 10.66.1.0/24, ip_range: 10.66.1.0/28 }]
  lab-internal:
    driver_opts: *isolated
    ipam:
      config: [{ subnet: 10.66.2.0/24 }]
