# ReconKit as a service: Redis, the web API + dashboard, a worker, the scheduler.
#
#   cp deploy/service.example.toml deploy/service.toml    # then edit targets and tokens
#   docker compose up -d --build
#   open http://127.0.0.1:8000
#
# Hardening: every ReconKit container runs as an unprivileged user on a read-only root
# filesystem with all Linux capabilities dropped. Only the worker gets one back,
# NET_RAW, for nmap's raw sockets (see the worker below).
name: reconkit

x-reconkit: &reconkit
  build: .
  # A released image instead of a local build: RECONKIT_IMAGE=ghcr.io/<owner>/reconkit:0.2.0
  image: ${RECONKIT_IMAGE:-reconkit:local}
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  volumes:
    - data:/data
    - ./deploy:/config:ro
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  depends_on:
    redis:
      condition: service_healthy
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  redis:
    image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    # The queue survives a restart: append-only file in its own volume. No port is
    # published: only the containers of this project can reach it.
    command: ["redis-server", "--appendonly", "yes", "--save", "300 1"]
    volumes:
      - redis:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    <<: *reconkit
    command: ["web", "--config", "/config/service.toml", "--host", "0.0.0.0", "--port", "8000"]
    # Published on the host's loopback only. To serve other machines, put a TLS reverse
    # proxy in front (it must send X-Forwarded-Proto; set FORWARDED_ALLOW_IPS to its
    # address) instead of publishing plain HTTP on the network.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *reconkit
    command: ["worker", "--config", "/config/service.toml"]
    # nmap needs raw sockets for SYN scans and traceroute. The image gives the nmap
    # binary that one capability (setcap cap_net_raw), which a non-root process can
    # only gain on exec if no-new-privileges is off: so it is off here, and only here.
    cap_add: [NET_RAW]
    security_opt:
      - no-new-privileges:false
    # Scale out with: docker compose up -d --scale worker=3
    # To scan the host's own LAN without NAT in between (Linux): network_mode: host,
    # and point redis_url at a Redis the host can reach.

  scheduler:
    <<: *reconkit
    command: ["scheduler", "--config", "/config/service.toml"]

volumes:
  data:
  redis:
