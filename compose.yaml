# ZuesScan as a service: Redis, the web API + dashboard, a worker, the scheduler.
#
#   cp deploy/service.example.toml deploy/service.toml    # then edit targets and tokens
#   docker compose up -d --build
#   open http://127.0.0.1:8000
#
# Hardening: every ZuesScan container runs as an unprivileged user on a read-only root
# filesystem with all Linux capabilities dropped. Only the worker gets one back,
# NET_RAW, for nmap's raw sockets (see the worker below).
name: zues-scan

x-zues: &zues
  build: .
  # A released image instead of a local build: ZUES_IMAGE=ghcr.io/<owner>/zues-scan:0.2.0
  image: ${ZUES_IMAGE:-zues-scan:local}
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  environment:
    # Without service.toml the service reads these, and targets, scopes and tokens are
    # added in the dashboard (the first admin: docker compose exec web zues user add NAME
    # --role admin). To use a file instead: ZUES_CONFIG=/config/service.toml (in ./deploy).
    ZUES_CONFIG: ${ZUES_CONFIG:-}
    ZUES_DB: /data/zues.db
    ZUES_REDIS_URL: redis://redis:6379/0
    # Redis's password, made by the redis service on its first start (D19). A file, not
    # a variable: a plugin's process gets no ZUES_* variable and cannot read /secrets.
    ZUES_REDIS_PASSWORD_FILE: /secrets/redis.pass
    # Alerts (optional; e.g. in a .env file next to this one, never committed):
    # the webhook, the HMAC secret that signs each alert, from which priority new
    # findings alert, after how many failed scans in a row.
    ZUES_WEBHOOK: ${ZUES_WEBHOOK:-}
    ZUES_WEBHOOK_SECRET: ${ZUES_WEBHOOK_SECRET:-}
    ZUES_WEBHOOK_SECRET_PREVIOUS: ${ZUES_WEBHOOK_SECRET_PREVIOUS:-}
    ZUES_NOTIFY_MIN_PRIORITY: ${ZUES_NOTIFY_MIN_PRIORITY:-P2}
    ZUES_NOTIFY_FAILED_SCANS: ${ZUES_NOTIFY_FAILED_SCANS:-3}
    ZUES_NOTIFY_KEEP_DAYS: ${ZUES_NOTIFY_KEEP_DAYS:-90}
    # on: a scope change in the dashboard needs a second admin's approval (D12).
    ZUES_SCOPE_APPROVAL: ${ZUES_SCOPE_APPROVAL:-off}
    # Third-party plugins the service may load (D14), as `zues plugins --pin NAME` prints
    # them, separated by commas; empty: the built-in plugins only.
    ZUES_PLUGINS: ${ZUES_PLUGINS:-}
    # nuclei's out-of-band templates (Log4Shell, blind SSRF): your own interactsh server,
    # by its domain, and its token. Empty: no out-of-band templates (public servers are
    # refused: targets would call out of the engagement).
    ZUES_INTERACTSH_SERVER: ${ZUES_INTERACTSH_SERVER:-}
    ZUES_INTERACTSH_TOKEN: ${ZUES_INTERACTSH_TOKEN:-}
  volumes:
    - data:/data
    - ./deploy:/config:ro
    - secrets:/secrets:ro
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  depends_on:
    redis:
      condition: service_healthy
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  redis:
    image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    # The queue survives a restart: append-only file in its own volume. No port is
    # published: only the containers of this project can reach it.
    # It needs a password (D19): made on the first start, 256 random bits, kept in the
    # secrets volume, readable by ZuesScan's user (10001) only. Whoever reaches Redis
    # without it - another container, a third-party plugin - gets NOAUTH. To change it,
    # write a new one into the file (docker compose run) and restart everything.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        if [ ! -s /secrets/redis.pass ]; then
          head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /secrets/redis.pass.new
          mv /secrets/redis.pass.new /secrets/redis.pass
        fi
        chown 10001:10001 /secrets/redis.pass
        chmod 400 /secrets/redis.pass
        printf 'requirepass %s\n' "$$(cat /secrets/redis.pass)" > /tmp/auth.conf
        chown redis /tmp/auth.conf
        exec docker-entrypoint.sh redis-server /tmp/auth.conf --appendonly yes --save "300 1"
    volumes:
      - redis:/data
      - secrets:/secrets
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /secrets/redis.pass)\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    <<: *zues
    command: ["web", "--host", "0.0.0.0", "--port", "8000"]
    # Published on the host's loopback only. To serve other machines, put a TLS reverse
    # proxy in front (it must send X-Forwarded-Proto; set FORWARDED_ALLOW_IPS to its
    # address) instead of publishing plain HTTP on the network.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *zues
    command: ["worker"]
    # nmap needs raw sockets for SYN scans and traceroute. The image gives the nmap
    # binary that one capability (setcap cap_net_raw), which a non-root process can
    # only gain on exec if no-new-privileges is off: so it is off here, and only here.
    cap_add: [NET_RAW]
    security_opt:
      - no-new-privileges:false
    # Scale out with: docker compose up -d --scale worker=3
    # To scan the host's own LAN without NAT in between (Linux): network_mode: host,
    # and point redis_url at a Redis the host can reach.

  scheduler:
    <<: *zues
    command: ["scheduler"]

volumes:
  data:
  redis:
  secrets:
