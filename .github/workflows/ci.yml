# CI: every push to main and every PR must pass lint + types + tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      # With the server extra, so that mypy checks the service against RQ's real types.
      - run: pip install -e ".[dev,server,server-test]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy reconkit tests

  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # requires-python = ">=3.11" — prove it on every supported version.
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest

  # The background service (reconkit[server]): queue, worker, scheduler and web API
  # through real RQ on an in-memory Redis and FastAPI's test client. The core test matrix above installs no extra, which also
  # proves that the core stays dependency-free and that these tests skip cleanly.
  server:
    name: server tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,server,server-test]"
      # The whole suite: the server tests run here, and the extras must not break the core.
      - run: pytest

  # The image: builds from the pinned base and hash-locked dependencies, runs as an
  # unprivileged user, and scans for real with nmap holding only NET_RAW.
  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t reconkit:ci .
      - run: docker compose config --quiet
      - name: smoke test
        run: |
          docker run --rm reconkit:ci --help > /dev/null
          test "$(docker run --rm --entrypoint id reconkit:ci -u)" = 10001
          docker network create lab
          docker run -d --rm --name target --network lab redis:7.4-alpine
          ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' target)
          docker run --rm --network lab --read-only --tmpfs /tmp --cap-drop ALL \
            --cap-add NET_RAW --entrypoint sh reconkit:ci -c "
              echo $ip > /tmp/scope.txt
              reconkit scan $ip --scope /tmp/scope.txt --db /tmp/r.db --profile full > /tmp/out
              cat /tmp/out
              grep -q '6379/tcp' /tmp/out && grep -q 'route:' /tmp/out"
