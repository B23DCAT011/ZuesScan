# CI: every push to main and every PR must pass lint + types + tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      # With the server extra, so that mypy checks the service against RQ's real types.
      - run: pip install -e ".[dev,server,server-test,mcp]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy zues_scan tests examples/zues-exposed-git/zues_exposed_git

  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # requires-python = ">=3.11" — prove it on every supported version.
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest

  # The background service (zues-scan[server]): queue, worker, scheduler and web API
  # through real RQ on an in-memory Redis and FastAPI's test client. The core test matrix above installs no extra, which also
  # proves that the core stays dependency-free and that these tests skip cleanly.
  server:
    name: server tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,server,server-test,mcp]"
      # The whole suite: the server tests run here, and the extras must not break the core.
      - run: pytest

  # The image: builds from the pinned base and hash-locked dependencies, runs as an
  # unprivileged user, and scans for real with nmap holding only NET_RAW.
  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t zues-scan:ci .
      - run: docker compose config --quiet
      - name: smoke test
        run: |
          docker run --rm zues-scan:ci --help > /dev/null
          test "$(docker run --rm --entrypoint id zues-scan:ci -u)" = 10001
          docker network create lab
          docker run -d --rm --name target --network lab redis:7.4-alpine
          ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' target)
          docker run --rm --network lab --read-only --tmpfs /tmp --cap-drop ALL \
            --cap-add NET_RAW --entrypoint sh zues-scan:ci -c "
              echo $ip > /tmp/scope.txt
              zues scan $ip --scope /tmp/scope.txt --db /tmp/r.db --profile full > /tmp/out
              cat /tmp/out
              grep -q '6379/tcp' /tmp/out && grep -q 'route:' /tmp/out"
      - name: zues doctor finds every tool ready in the image
        run: |
          docker run --rm --read-only --tmpfs /tmp zues-scan:ci doctor --json > doctor.json
          python3 - <<'PY'
          import json
          report = json.load(open("doctor.json"))
          status = {c["name"]: c["status"] for c in report["checks"]}
          print(status)
          assert report["ready"], report
          tools = ("nmap", "nmap rights", "nuclei", "nuclei templates", "subfinder", "dnsx", "naabu", "httpx", "ssh")
          for tool in tools:
              assert status[tool] == "ok", (tool, status[tool])
          PY
      - name: every tool in the image is the locked version
        run: |
          docker run --rm --read-only --tmpfs /tmp --entrypoint python zues-scan:ci -c '
          from zues_scan import tools
          from zues_scan.plugins.dnsx import DnsxPlugin
          from zues_scan.plugins.httpx import HttpxPlugin
          from zues_scan.plugins.naabu import NaabuPlugin
          from zues_scan.plugins.nmap import NmapPlugin
          from zues_scan.plugins.nuclei import NucleiPlugin, default_templates
          from zues_scan.plugins.subfinder import SubfinderPlugin
          lock = tools.for_platform(tools.read_lock(), "linux-amd64")
          want = {tool: lock[tool].version for tool in tools.BINARIES}
          want["nuclei"] += f" (templates {lock[tools.TEMPLATES].version})"
          seen = {
              "nuclei": NucleiPlugin(templates=default_templates()).version(),
              "subfinder": SubfinderPlugin().version(),
              "dnsx": DnsxPlugin().version(),
              "httpx": HttpxPlugin().version(),
              "naabu": NaabuPlugin(nmap=lambda _: NmapPlugin()).version().split()[0],
          }
          print(seen)
          assert seen == want, (seen, want)'

  # The whole system on the vulnerable lab: compose stack + targets behind a router,
  # scheduled scans, then the lifecycle demo must end with a verified fix and a fake fix.
  lab:
    name: lab end to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sh lab/up.sh > /dev/null   # its token is printed once: keep it out of the log
      - run: sh lab/demo.sh | tee demo.txt
      - name: the scans saw what the demo did
        run: |
          grep -Eq '^ +[0-9]+ +fake_fix .*CVE-2021-41773' demo.txt
          grep -Eq '^ +[0-9]+ +fixed .*CVE-2021-23017' demo.txt
          grep -Eq '^ +[0-9]+ +accepted .*CVE-2018-15473' demo.txt
      - name: nuclei confirmed what the versions suggested
        run: |
          fail=0
          if ! grep -Eq '^ +[0-9]+ +(new|open) .*CVE-2023-48795' demo.txt; then
            echo "::error title=lab::nuclei did not report Terrapin (CVE-2023-48795) on the SSH server"
            fail=1
          fi
          if ! grep -q 'confidence: confirmed' demo.txt; then
            echo "::error title=lab::nuclei did not confirm Apache CVE-2021-41773"
            fail=1
          fi
          # Out of band: nmap misnames the app's port, httpx finds the web service, nuclei
          # gets the DNS callback on the lab's interactsh server.
          if ! grep -Eq '^ +[0-9]+ +(new|open) .*CVE-2021-44228' demo.txt; then
            echo "::error title=lab::nuclei did not confirm Log4Shell (CVE-2021-44228) out of band"
            fail=1
          fi
          exit "$fail"
      - name: each run records the checks' versions, and httpx saw the web services
        run: |
          docker compose -p zues-lab exec -T worker python -c "
          from zues_scan.storage import Storage
          with Storage('/data/zues.db') as store:
              run = store.load_run(store.latest_run_id())
          print(run.tool_versions)
          assert '(templates ' in run.tool_versions['nuclei'], run.tool_versions
          assert run.tool_versions['httpx'], run.tool_versions
          pages = [s.web for a in run.assets for s in a.services if s.web]
          print(pages)
          assert pages and all(p.status for p in pages), pages"
      - name: the lab cannot reach the Internet
        run: |
          probe='timeout 5 bash -c "</dev/tcp/1.1.1.1/443"'
          if docker compose -p zues-lab exec -T apache bash -c "$probe"; then
            echo "a lab target reached the Internet"; exit 1
          fi
      # When a check above fails, show why without anyone re-running the lab: the demo's
      # findings and finding details, the runs and the worker's last log lines (no secret
      # in them: the admin token went to /dev/null in lab/up.sh).
      - name: what the lab saw (on failure)
        if: failure()
        run: |
          sed -n '/== what the scans say now/,$p' demo.txt | head -80
          # The job's log needs a GitHub login; annotations do not: the findings table, so
          # that anyone can see why without re-running the lab.
          sed -n '/== what the scans say now/,/^$/p' demo.txt | sed -n '2,10p'             | while IFS= read -r line; do echo "::warning title=lab finding::$line"; done
          docker compose -p zues-lab exec -T worker zues runs --db /data/zues.db || true
          # Each run's nuclei notes and its network pass (Terrapin comes from there): how
          # many lines it printed, how long it may run, what it said on stderr - as
          # annotations, so that a flaky check can be told from a broken one.
          docker compose -p zues-lab exec -T worker python -c "
          from zues_scan.storage import Storage
          with Storage('/data/zues.db') as store:
              for s in store.list_runs():
                  run = store.load_run(s.id)
                  notes = '; '.join(n for n in run.notes if n.startswith('nuclei'))[:300]
                  print(f'::warning title=lab run {s.id}::{run.target} {run.status.value} {notes}')
                  for raw in run.raw_outputs:
                      if raw.plugin == 'nuclei' and '-pt' in raw.command:
                          err = ' '.join((raw.stderr or '').split())[-300:]
                          lines = len(raw.content.splitlines())
                          print(f'::warning title=lab run {s.id} nuclei network pass::{lines} line(s); stderr: {err}')
          " || true
          docker compose -p zues-lab logs --no-color --tail 80 worker || true
      - if: always()
        run: sh lab/down.sh
