# ZuesScan service configuration for Docker Compose. Copy it to deploy/service.toml
# (git-ignored) and edit: compose mounts this folder read-only at /config.
#
# Only the targets listed here can be scanned, by the scheduler or through the web.

[service]
db = "/data/zues.db"                 # in the `data` volume
# cve_cache = "/data/zues-cve.db"    # NVD data: docker compose run --rm worker cve sync ...
# subfinder_config = "/config/subfinder.yaml"  # API keys of subfinder's sources (git-ignored)
# nuclei_templates: the image's pinned copy is used (ZUES_NUCLEI_TEMPLATES)
redis_url = "redis://redis:6379/0"       # the `redis` service of compose.yaml
queue = "zues"

# One block per person or script: `docker compose run --rm web token --name alice --role operator`
# prints the token once and the block to paste here. Never store the token itself.
# [[tokens]]
# name = "alice"
# sha256 = "<64 hex characters>"
# role = "operator"                      # viewer: read only; operator: scans and decisions

[[targets]]
name = "example"
target = "192.0.2.10"                    # TEST-NET-1: replace with a host you are authorised to scan
scope = "/config/example-scope.txt"
profile = "standard"
# every = "24h"                          # scheduled scan
# engagement = "PT-2026-001"

# Third-party plugins load only when pinned here (built-ins always do). Install the
# package in the image, review its code, then paste what `zues plugins --pin NAME` prints:
# [[plugins]]
# name = "exposed-git"
# package = "zues-exposed-git"
# version = "0.1.0"
# sha256 = "<64 hex characters>"         # of the files the package installed
# activity = "active"                    # what you judged it does: the scope gate uses this

# [notify]
# webhook = "https://hooks.slack.com/services/..."
# min_priority = "P2"
